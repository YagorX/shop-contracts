patch:
  tags: [Cart]
  summary: Update quantity of a cart item
  operationId: updateCartItem
  security:
    - bearerAuth: []
  parameters:
    - $ref: '../../gateway.v1.yaml#/components/parameters/XAppIdHeader'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../gateway.v1.yaml#/components/schemas/UpdateItemRequest'
  responses:
    '200':
      description: Item updated
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/OkResponse'
    '400':
      description: Bad request body
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/ErrorEnvelope'
    '401':
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/ErrorEnvelope'

delete:
  tags: [Cart]
  summary: Clear the cart
  operationId: clearCart
  security:
    - bearerAuth: []
  parameters:
    - $ref: '../../gateway.v1.yaml#/components/parameters/XAppIdHeader'
  responses:
    '200':
      description: Cart cleared
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/OkResponse'
    '401':
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/ErrorEnvelope'

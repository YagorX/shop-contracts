post:
  tags: [Cart]
  summary: Add an item to the cart
  operationId: addCartItem
  security:
    - bearerAuth: []
  parameters:
    - $ref: '../../gateway.v1.yaml#/components/parameters/XAppIdHeader'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../gateway.v1.yaml#/components/schemas/AddItemRequest'
  responses:
    '200':
      description: Item added
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/OkResponse'
    '400':
      description: Bad request body
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/ErrorEnvelope'
    '401':
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/ErrorEnvelope'
    '404':
      description: Product not found
      content:
        application/json:
          schema:
            $ref: '../../gateway.v1.yaml#/components/schemas/ErrorEnvelope'
